<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>AR IT2V · 视频预览</title>
<style>
:root{color-scheme:dark;--bg:#101315;--panel:#181d20;--ink:#eef2f2;--muted:#a6b1b6;--line:#30383d;--accent:#a3ddc5;--focus:#bdefff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit}a{color:inherit}button:focus-visible,a:focus-visible,video:focus-visible{outline:3px solid var(--focus);outline-offset:4px}button{cursor:pointer}.wrap{max-width:1376px;margin:auto;padding:32px 40px 80px}.masthead{display:flex;justify-content:space-between;align-items:center;padding-bottom:23px;border-bottom:1px solid var(--line)}.brand{font-weight:650;letter-spacing:.08em;font-size:12px}.mode-label{color:var(--muted);font-size:13px}.intro{padding:34px 0 26px}.intro h1{font-size:clamp(32px,4vw,48px);line-height:1.15;letter-spacing:-.045em;margin:0 0 15px;font-weight:650}.intro p{color:var(--muted);max-width:880px;margin:0;font-size:16px}.recipe{border:1px solid var(--line);border-radius:12px;padding:20px 24px;background:var(--panel)}.recipe-title{display:flex;align-items:baseline;gap:14px;margin-bottom:10px}.recipe-title h2{font-size:17px;letter-spacing:-.02em;margin:0}.recipe-title span{color:var(--accent);font-size:13px}.param-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 28px}.param{padding:9px 0}.param dt{font-size:12px;color:var(--muted);margin:0 0 2px}.param dd{margin:0;font-size:15px;font-variant-numeric:tabular-nums}.recipe-note{color:var(--muted);font-size:12px;margin:11px 0 0;padding-top:14px;border-top:1px solid var(--line)}.toolbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);margin:18px 0 32px}.toolbar-group{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.switch{border:1px solid transparent;border-radius:7px;color:var(--muted);background:transparent;padding:7px 13px;min-height:40px}.switch[aria-pressed="true"]{background:#27312e;color:#c9efe1;border-color:#41564d}.switch:hover{color:var(--ink);background:#242b2f}.switch[aria-pressed="true"]:hover{background:#303e37}.section{margin-bottom:56px;scroll-margin-top:95px}.section[hidden],.sample[hidden]{display:none}.section-heading{display:flex;align-items:baseline;gap:14px;margin:0 0 22px}.section-heading h2{font-size:23px;letter-spacing:-.035em;margin:0}.section-heading p{font-size:13px;color:var(--muted);margin:0}.sample{margin:0 0 34px}.sample-head{display:flex;gap:24px;justify-content:space-between;align-items:flex-start;margin-bottom:12px}.sample h3{font-size:17px;line-height:1.45;margin:0 0 6px;font-weight:550}.caption{font-size:14px;color:var(--muted);margin:0;max-width:980px;overflow-wrap:anywhere}.clip-note{font-size:12px;white-space:nowrap;color:var(--accent);padding-top:3px;font-variant-numeric:tabular-nums}.video-frame{background:#070a0b;border:1px solid var(--line);border-radius:10px;overflow:hidden}.video-labels{display:grid;grid-template-columns:1fr 1fr;font-size:12px;color:#d6dee2;background:#1b2226}.video-labels span{padding:9px 16px}.video-labels span+span{border-left:1px solid var(--line);color:var(--accent)}video{display:block;width:100%;height:auto;aspect-ratio:1280/360;background:#070a0b;object-fit:contain}.media-error{display:none;padding:18px;color:#f4c9a7;font-size:13px}.media-error.visible{display:block}.sample-footer{display:flex;gap:20px;justify-content:space-between;align-items:baseline;margin-top:8px;font-size:12px;color:var(--muted)}.source-links{display:flex;gap:15px}.source-links a{text-decoration:none;text-underline-offset:4px}.source-links a:hover{text-decoration:underline;color:var(--ink)}.endnote{margin:10px 0 0;border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:12px}.empty{padding:32px;color:var(--muted)}@media(max-width:800px){.wrap{padding:22px 20px 48px}.param-grid{grid-template-columns:repeat(2,1fr)}.recipe{padding:17px 18px}.sample-head{display:block}.clip-note{display:block;padding-top:8px}.toolbar{align-items:flex-start;flex-wrap:wrap;margin-bottom:26px;padding:12px 0}.switch{padding:6px 10px}.sample-footer{align-items:flex-start;gap:8px;flex-wrap:wrap}.intro{padding:28px 0 23px}}@media(max-width:420px){.wrap{padding-inline:14px}.recipe-title{display:block}.mode-label{display:none}.video-labels span{padding:7px 10px}.param-grid{gap:4px 12px}}
</style>
</head>
<body>
<main class="wrap">
<header class="masthead"><span class="brand">COSMOS3 / AR IT2V</span><span class="mode-label">首帧图像 ＋ 文本 → 视频</span></header>
<div class="intro"><h1>看动作，也看持续生成。</h1><p>训练集与验证集的真实视频和生成结果并排播放。训练片段最长 97 帧（约 3.23 秒）；本次长片为 257 帧（约 8.57 秒），观察超过训练长度的连续生成。短片截自同一次长片的动作区间，并非单独的短段推理。</p></div>
<section class="recipe" aria-label="本次生成设置"><div class="recipe-title"><h2 id="checkpoint-title"></h2><span id="version"></span></div><dl class="param-grid" id="params"></dl><p class="recipe-note" id="noise-note"></p></section>
<nav class="toolbar" aria-label="视频筛选和片长"><div class="toolbar-group" aria-label="数据划分"><button class="switch" data-split="all" aria-pressed="true">全部片段</button><button class="switch" data-split="train" aria-pressed="false">训练集</button><button class="switch" data-split="test" aria-pressed="false">验证集</button></div><div class="toolbar-group" aria-label="片长"><button class="switch" data-length="short" aria-pressed="true">短片 · 动作区间</button><button class="switch" data-length="long" aria-pressed="false">长片 · 完整生成</button></div></nav>
<div id="gallery"></div>
<p class="endnote">只提供视频观察，不计算指标。短片是长片的原速裁剪，使用同一批生成结果；切换片长不会重新生成。</p>
<noscript><p class="empty">请启用 JavaScript 查看视频画廊。</p></noscript>
</main>
<script id="gallery-data" type="application/json">__GALLERY_JSON__</script>
<script>
'use strict';
const data=JSON.parse(document.querySelector('#gallery-data').textContent);
const fmt=value=>Number(value).toFixed(2).replace(/\.00$/,'');
const text=(tag,value,cls)=>{const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e;};
document.title=`AR IT2V · Step ${data.checkpoint_step} 视频预览`;
document.querySelector('#checkpoint-title').textContent=`训练第 ${data.checkpoint_step} 步`;
document.querySelector('#version').textContent=data.version.replace('ar_it2v_','AR IT2V ');
const durations=[...new Set(data.samples.map(s=>`${s.frames} 帧 / ${fmt(s.duration)} 秒`))];
const parameters=[['模型','Cosmos3-Nano · 纯视频 AR'],['长片时长',durations.join('；')],['回放速度',`${fmt(data.fps)} fps · 原始时间轴`],['随机种子',data.seed],['每块去噪次数',`${data.denoise_steps} 次`],['文本引导强度',`${fmt(data.guidance)}（CFG）`],['历史刷新噪声',fmt(data.context_sigma)],['对照方式','左：真实视频　右：模型生成']];
for(const [label,value] of parameters){const item=text('div','','param');item.append(text('dt',label),text('dd',value));document.querySelector('#params').append(item);}
document.querySelector('#noise-note').textContent=`“历史刷新噪声 ${fmt(data.context_sigma)}”指每块生成后，加入少量噪声再写入模型的历史记忆，供后续块使用；不是给展示视频添加噪点。每块去噪次数与回放帧率是两项不同设置。`;
let lengthMode='short';
const cards=[];
function changeLength(card){const s=card.sample;card.video.pause();card.video.src=s.media[lengthMode==='short'?'short_preview.mp4':'preview.mp4'];card.error.classList.remove('visible');card.video.load();const end=s.short_start+s.short_duration;card.note.textContent=lengthMode==='short'?`${fmt(s.short_duration)} 秒 · 长片 ${fmt(s.short_start)}–${fmt(end)} 秒`:`${fmt(s.duration)} 秒 · ${s.frames} 帧`;card.description.textContent=lengthMode==='short'?'来自下方“长片”同一次生成的动作区间裁剪。':'从首帧与文本出发，逐块连续生成完整视频。';}
for(const split of ['train','test']){const samples=data.samples.filter(s=>s.split===split);if(!samples.length)continue;const section=text('section','','section');section.dataset.split=split;const header=text('div','','section-heading');header.append(text('h2',split==='train'?'训练集':'验证集'),text('p',`${samples.length} 个片段 · ${split==='train'?'观察训练数据上的生成':'观察未参与训练的数据'}`));section.append(header);for(const s of samples){const article=text('article','','sample');const head=text('div','','sample-head');const copy=text('div','');copy.append(text('h3',s.title),text('p',s.caption||'未提供文本描述','caption'));const note=text('span','','clip-note');head.append(copy,note);const frame=text('div','','video-frame');const labels=text('div','','video-labels');labels.append(text('span','真实视频 · GT'),text('span','模型生成 · AR'));const video=document.createElement('video');video.controls=true;video.playsInline=true;video.preload='metadata';video.setAttribute('aria-label',`${split==='train'?'训练集':'验证集'}，${s.title}，真实视频与生成视频对照`);const error=text('p','视频暂时无法加载，请刷新或使用下方的单独视频链接。','media-error');video.addEventListener('error',()=>error.classList.add('visible'));video.addEventListener('play',()=>cards.forEach(c=>{if(c.video!==video)c.video.pause();}));frame.append(labels,video,error);const footer=text('div','','sample-footer');const description=text('span','');const links=text('div','','source-links');for(const [label,filename] of [['真实视频','gt.mp4'],['生成视频','generated.mp4']]){const a=text('a',label);a.href=s.media[filename];a.target='_blank';a.rel='noopener';links.append(a);}footer.append(description,links);article.append(head,frame,footer);section.append(article);const card={sample:s,video,note,error,description};cards.push(card);changeLength(card);}document.querySelector('#gallery').append(section);}
for(const button of document.querySelectorAll('[data-length]'))button.addEventListener('click',()=>{lengthMode=button.dataset.length;document.querySelectorAll('[data-length]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));cards.forEach(changeLength);});
for(const button of document.querySelectorAll('button[data-split]'))button.addEventListener('click',()=>{const selected=button.dataset.split;document.querySelectorAll('button[data-split]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelectorAll('section[data-split]').forEach(s=>s.hidden=selected!=='all'&&s.dataset.split!==selected);cards.forEach(c=>{if(selected!=='all'&&c.sample.split!==selected)c.video.pause();});});
</script>
</body>
</html>
