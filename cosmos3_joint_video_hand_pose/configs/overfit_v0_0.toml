[job]
task       = "vfm"
experiment = "egoverse_joint_video_hand_pose_overfit_v0_0"
project    = "joint_video_hand_pose"
group      = "overfit"
name       = "overfit_v0.0"
wandb_mode = "online"

[model]
precision = "bfloat16"

[model.parallelism]
data_parallel_shard_degree     = 4
data_parallel_replicate_degree = 1
context_parallel_shard_degree  = 2

[model.activation_checkpointing]
mode = "full"

[model.compile]
enabled = false

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 2.0e-5

[scheduler]
warm_up_steps = [20]
cycle_lengths = [2000]
f_start = [0.0]
f_max = [1.0]
f_min = [0.1]

[trainer]
max_iter     = 2000
logging_iter = 1

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 300
