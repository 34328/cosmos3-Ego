<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>RBS WAM · Pick & Place</title>
<style>
:root { color-scheme:light; --bg:#f5f6f8; --surface:#fff; --text:#17202b; --muted:#596575; --line:#dce1e8; --accent:#245bc4; --selected:#eaf0fc; --green:#178346; --red:#bc3535; }
@media (prefers-color-scheme:dark) { :root:not([data-theme="light"]) { color-scheme:dark; --bg:#101318; --surface:#191e26; --text:#eef1f5; --muted:#b0bac7; --line:#353e4b; --accent:#9ebcff; --selected:#263550; --green:#72db97; --red:#ff9898; } }
:root[data-theme="dark"] { color-scheme:dark; --bg:#101318; --surface:#191e26; --text:#eef1f5; --muted:#b0bac7; --line:#353e4b; --accent:#9ebcff; --selected:#263550; --green:#72db97; --red:#ff9898; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif; }
main { max-width:1800px; margin:0 auto; padding:30px 28px 44px; }
button,select,a { font:inherit; }
button,select { min-height:40px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--text); padding:7px 12px; }
button,a,summary,select { cursor:pointer; }
button { white-space:nowrap; }
button:hover,a:hover { color:var(--accent); }
button:active { background:var(--selected); }
button[aria-pressed="true"] { background:var(--selected); border-color:var(--accent); color:var(--accent); }
:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
a { color:var(--accent); text-underline-offset:3px; }
.brand { color:var(--muted); font-size:13px; font-weight:650; letter-spacing:.06em; }
h1 { margin:5px 0 8px; font-size:clamp(24px,2.3vw,34px); line-height:1.25; letter-spacing:-.03em; font-weight:650; }
.intro { margin:0; color:var(--muted); max-width:76ch; }
.header-line { display:flex; align-items:flex-start; justify-content:space-between; gap:24px; }
.theme-label { display:flex; align-items:center; gap:8px; flex:none; font-size:13px; color:var(--muted); }
.experiment { margin:16px 0 18px; padding:11px 14px; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
.experiment summary { font-size:14px; }
.params { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin:16px 0 4px; }
.params div { min-width:0; }
dt { color:var(--muted); font-size:12px; }
dd { margin:2px 0 0; overflow-wrap:anywhere; font-size:13px; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; }
.checkpoint { grid-column:1/-1; }
.toolbar { display:flex; align-items:center; flex-wrap:wrap; justify-content:space-between; gap:12px; margin-bottom:12px; }
.view-switch { display:flex; gap:7px; flex-wrap:wrap; }
.filter { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:14px; }
.legend { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:0 0 6px; color:var(--muted); font-size:13px; }
.legend span { padding:6px 0; }
.legend .gt { color:var(--green); }
.legend .prediction { color:var(--red); }
.view-note { color:var(--muted); margin:0 0 24px; font-size:13px; }
.grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; align-items:start; }
.grid.single { grid-template-columns:minmax(0,1fr); max-width:1180px; margin:0 auto; }
h2 { font-size:18px; font-weight:650; margin:0 0 15px; }
h2 small { margin-left:9px; color:var(--muted); font-size:13px; font-weight:400; }
.cards { display:grid; gap:24px; }
.sample { min-width:0; }
.sample-title { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:0 0 8px; }
h3 { font-size:16px; margin:0; font-weight:600; }
.duration { color:var(--muted); font-size:13px; white-space:nowrap; }
.sample-description { margin:0 0 10px; color:var(--muted); font-size:13px; }
.player { position:relative; border-radius:8px; overflow:hidden; background:#050607; border:1px solid var(--line); aspect-ratio:1920 / 368; }
video { display:block; width:100%; height:100%; object-fit:contain; background:#050607; }
.media-error { position:absolute; inset:0; display:grid; align-content:center; justify-items:center; padding:18px; background:var(--surface); color:var(--muted); text-align:center; font-size:13px; }
.media-error[hidden],[hidden] { display:none!important; }
.sample-footer { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-top:9px; }
.sample-id { color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
.actions { display:flex; align-items:center; gap:12px; flex:none; }
.actions a { font-size:13px; }
.actions button { font-size:13px; padding:4px 10px; min-height:32px; }
.empty { padding:30px 0; color:var(--muted); }
dialog { width:min(96vw,1700px); max-width:none; border:1px solid var(--line); border-radius:8px; padding:14px; color:var(--text); background:var(--surface); }
dialog::backdrop { background:rgb(0 0 0/.75); }
.dialog-top { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:12px; }
dialog video { max-height:80dvh; height:auto; }
footer { margin-top:34px; color:var(--muted); font-size:12px; }
@media (max-width:1023px) { .grid { grid-template-columns:minmax(0,1fr); gap:32px; } .legend { font-size:12px; } }
@media (max-width:639px) { main { padding:20px 14px 32px; } .header-line { flex-direction:column; gap:14px; } .params { grid-template-columns:repeat(2,minmax(0,1fr)); } .toolbar { align-items:flex-start; } .sample-title,.sample-footer { align-items:flex-start; flex-direction:column; gap:5px; } .legend { gap:5px; font-size:11px; } .theme-label { align-self:flex-end; } }
</style>
</head>
<body>
<main>
<header>
<div class="header-line">
<div><div class="brand">RBS WAM</div><h1 id="title">Pick & Place · 模型可视化</h1><p class="intro">挑选手部移动明显的拿起、移动、放下动作。短片看完整操作，长片看连续生成与累计漂移。</p></div>
<label class="theme-label">外观 <select id="theme" aria-label="页面外观"><option value="auto">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
</div>
<details class="experiment">
<summary id="summary">实验参数</summary>
<dl class="params" id="params"></dl>
</details>
</header>
<div class="toolbar">
<div class="view-switch" role="group" aria-label="视频视图">
<button type="button" data-view="short" aria-pressed="true">操作短片</button>
<button type="button" data-view="full" aria-pressed="false">完整长片</button>
<button type="button" data-view="reference" aria-pressed="false" id="reference-switch" hidden>历史版本对比</button>
</div>
<label class="filter">样本 <select id="split"><option value="all">训练集 + heldout</option><option value="train">只看训练集</option><option value="heldout">只看 heldout</option></select></label>
</div>
<div class="legend" id="legend" aria-label="视频三栏说明"><span class="gt">GT RGB + 绿色真实骨架</span><span class="prediction">gt-history RGB + 红色预测骨架</span><span class="prediction">generated RGB + 红色预测骨架</span></div>
<p class="view-note" id="view-note">短片截自同一次长推理，保留此前历史；每条覆盖所选动作区间，时长单独标注。</p>
<div class="grid" id="grid">
<section data-split="train"><h2>训练集<small id="train-count"></small></h2><div class="cards" id="train-cards"></div></section>
<section data-split="heldout"><h2>Heldout<small id="heldout-count"></small></h2><div class="cards" id="heldout-cards"></div></section>
</div>
<p class="empty" id="empty" hidden>此视图没有可用视频。历史对比只展示已有参考视频的样本。</p>
<footer>统一三栏渲染 · 原始时间轴 · 30fps · 视频默认暂停，按需播放。短片与长片来自同一次推理。</footer>
<noscript><p>此网页需要启用 JavaScript 才能切换和查看视频。</p></noscript>
</main>
<template id="sample-card">
<article class="sample">
<div class="sample-title"><h3></h3><span class="duration"></span></div>
<p class="sample-description"></p>
<div class="player"><video controls playsinline preload="metadata"></video><p class="media-error" hidden>视频无法加载。请确认视频文件与网页一起保存，也可使用下方下载链接打开。</p></div>
<div class="sample-footer"><details class="sample-id"><summary>样本信息</summary><span></span></details><div class="actions"><a download>下载视频</a><button type="button">放大 / 全屏</button></div></div>
</article>
</template>
<dialog id="viewer"><div class="dialog-top"><strong id="viewer-title"></strong><button type="button" id="close-viewer">关闭</button></div><video controls playsinline preload="metadata"></video></dialog>
<script type="application/json" id="manifest">__MANIFEST_JSON__</script>
<script>
const data = JSON.parse(document.getElementById("manifest").textContent);
const experiment = data.experiment;
const $ = (id) => document.getElementById(id);
let view = "short";
const seconds = (n) => Number(n).toFixed(1) + " 秒";
const title = experiment.title || "Pick & Place · 模型可视化";
$("title").textContent = title;
document.title = title + " · RBS WAM";
$("summary").textContent = experiment.version + " · Step " + experiment.step + " · σ " + experiment.sigma_small + " · 查看参数";
const parameters = [["版本",experiment.version],["Checkpoint step",experiment.step],["σ_small",experiment.sigma_small],["Seed",experiment.seed],["联合采样步数",experiment.joint_steps],["块数",experiment.n_chunks ?? 17],["回放帧率",experiment.fps ?? 30],["短片来源","长推理动作区间裁剪"],["Checkpoint",experiment.checkpoint]];
for (const [label,value] of parameters) { const entry=document.createElement("div"); const term=document.createElement("dt"); const definition=document.createElement("dd"); term.textContent=label; definition.textContent=value; entry.append(term,definition); if(label==="Checkpoint") entry.className="checkpoint"; $("params").append(entry); }
if(data.samples.some((sample)=>sample.reference_video)) $("reference-switch").hidden=false;
const cards = data.samples.map((sample) => {
  const article = $("sample-card").content.firstElementChild.cloneNode(true);
  const video = article.querySelector("video");
  article.querySelector("h3").textContent=sample.title;
  article.querySelector(".sample-id span").textContent=sample.sample_id + " · 起始帧 " + sample.start;
  const description=article.querySelector(".sample-description");
  description.textContent=sample.description || sample.selection_basis || "";
  description.hidden=!description.textContent;
  video.setAttribute("aria-label", sample.title + " 三栏对比");
  video.poster=sample.poster;
  video.addEventListener("play",()=>document.querySelectorAll("video").forEach(other=>{ if(other!==video) other.pause(); }));
  video.addEventListener("error",()=>article.querySelector(".media-error").hidden=false);
  video.addEventListener("loadedmetadata",()=>{ if(view!=="short") article.querySelector(".duration").textContent=seconds(video.duration); });
  article.querySelector("button").addEventListener("click",()=> {
    video.pause(); $("viewer-title").textContent=sample.title;
    const expanded=$("viewer").querySelector("video"); expanded.src=video.currentSrc || video.src; expanded.poster=sample.poster;
    $("viewer").showModal();
  });
  $(sample.split+"-cards").append(article);
  return {sample,article,video};
});
function refresh() {
  let visible=0;
  const split=$("split").value;
  for (const section of document.querySelectorAll("section[data-split]")) section.hidden=split!=="all" && section.dataset.split!==split;
  $("grid").classList.toggle("single",split!=="all");
  for (const {sample,article,video} of cards) {
    video.pause(); article.hidden=(view==="reference" && !sample.reference_video);
    const src=view==="short" ? sample.short_video : view==="reference" ? sample.reference_video : sample.full_video;
    if(src && video.getAttribute("src")!==src) { article.querySelector(".media-error").hidden=true; video.src=src; }
    article.querySelector("a").href=src || sample.full_video;
    article.querySelector(".duration").textContent=view==="short" ? seconds(sample.short_end_sec-sample.short_start_sec)+" · 长推理 "+Number(sample.short_start_sec).toFixed(1)+"–"+Number(sample.short_end_sec).toFixed(1)+" 秒" : "完整长片";
    if(!article.hidden && (split==="all" || sample.split===split)) visible++;
  }
  for(const group of ["train","heldout"]) $(group+"-count").textContent=cards.filter(({sample,article})=>sample.split===group&&!article.hidden).length+" 个样本";
  for(const button of document.querySelectorAll("[data-view]")) button.setAttribute("aria-pressed",String(button.dataset.view===view));
  const labels=$("legend").children;
  labels[1].textContent=view==="reference" ? (experiment.reference_label || "参考版本 generated")+" + 红色预测骨架" : "gt-history RGB + 红色预测骨架";
  labels[2].textContent=view==="reference" ? experiment.version+" generated + 红色预测骨架" : "generated RGB + 红色预测骨架";
  $("view-note").textContent=view==="short" ? "短片截自同一次长推理，保留此前历史；每条覆盖所选动作区间，时长单独标注。" : view==="full" ? "完整 17 块长推理，按原始时间轴回放。使用播放器可逐段查看。" : "复用已有参考版本视频，仅展示具备参考视频的样本；不重新运行参考模型。";
  $("empty").hidden=visible>0;
}
for(const button of document.querySelectorAll("[data-view]")) button.addEventListener("click",()=>{ view=button.dataset.view; refresh(); });
$("split").addEventListener("change",refresh);
function applyTheme(value) { document.documentElement.dataset.theme=value; $("theme").value=value; try { localStorage.setItem("rbs-wam-theme",value); } catch (_) {} }
try { const saved=localStorage.getItem("rbs-wam-theme"); if(["auto","light","dark"].includes(saved)) applyTheme(saved); } catch (_) {}
$("theme").addEventListener("change",()=>applyTheme($("theme").value));
$("close-viewer").addEventListener("click",()=>$("viewer").close());
$("viewer").addEventListener("close",()=>{ const video=$("viewer").querySelector("video"); video.pause(); video.removeAttribute("src"); video.load(); });
refresh();
</script>
</body>
</html>
