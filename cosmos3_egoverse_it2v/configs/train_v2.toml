[job]
task = "vfm"
experiment = "egoverse_it2v_v1"
project = "egoverse_it2v"
group = "train"
name = "v2"
wandb_mode = "online"

[model]
precision = "bfloat16"

[model.parallelism]
data_parallel_shard_degree = 4
data_parallel_replicate_degree = 1
context_parallel_shard_degree = 2

[model.activation_checkpointing]
mode = "full"

[model.compile]
enabled = false

[optimizer]
lr = 8.0e-5
betas = [0.9, 0.95]
eps = 1.0e-6
weight_decay = 0.0

[scheduler]
warm_up_steps = [50]
cycle_lengths = [1000]
f_start = [0.0]
f_max = [1.0]
f_min = [0.0]

[trainer]
max_iter = 600
logging_iter = 1

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 300
